application:
  subdomain: cloudsaver
  background_task: true
  multi_instance: false
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://cloudsaver:8008/
services:
  cloudsaver:
    # upstream: jiangrui1994/cloudsaver:0.10.0
    image: registry.lazycat.cloud/czyt/jiangrui1994/cloudsaver:da3f0d3834359f08
    binds:
      - /lzcapp/var/data:/app/data
      - /lzcapp/var/config:/app/config
