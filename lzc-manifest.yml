application:
  subdomain: cloudsaver
  background_task: true
  multi_instance: false
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://cloudsaver:8008/
services:
  cloudsaver:
    # upstream: jiangrui1994/cloudsaver:0.9.2
    image: registry.lazycat.cloud/czyt/jiangrui1994/cloudsaver:484e465e68befd2e
    binds:
      - /lzcapp/var/data:/app/data
      - /lzcapp/var/config:/app/config
