application:
  subdomain: cloudsaver
  background_task: true
  multi_instance: false
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://cloudsaver:8008/
services:
  cloudsaver:
    # upstream: jiangrui1994/cloudsaver:0.9.1
    image: registry.lazycat.cloud/czyt/jiangrui1994/cloudsaver:5d7cb3e9c06e921c
    binds:
      - /lzcapp/var/data:/app/data
      - /lzcapp/var/config:/app/config
